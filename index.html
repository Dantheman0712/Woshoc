<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Countdown - Enterprise</title>
    <style>
        /* ============================================
           COLOR SYSTEM - GOLD & NAVY
           ============================================ */

        :root {
            /* Light Mode */
            --primary-navy: #1a2f5a;
            --primary-gold: #d4a574;
            --primary-gold-dark: #b8926f;
            --primary-gold-light: #e8c9b3;
            
            --bg-primary-light: #ffffff;
            --bg-secondary-light: #f8f6f3;
            --bg-tertiary-light: #f0ede8;
            
            --text-primary-light: #1a2f5a;
            --text-secondary-light: #4a5f7f;
            --text-tertiary-light: #8a9fb0;
            
            --border-light-mode: #e5ddd3;
            --border-light-mode-strong: #d9cfc2;
            
            /* Dark Mode */
            --bg-primary-dark: #0f1823;
            --bg-secondary-dark: #1a2538;
            --bg-tertiary-dark: #233652;
            
            --text-primary-dark: #f5f1ed;
            --text-secondary-dark: #d4c9be;
            --text-tertiary-dark: #9d9285;
            
            --border-dark-mode: #2d3d52;
            --border-dark-mode-strong: #3d4d62;
            
            /* Semantic Colors */
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --info: #3498db;
            
            /* Shadow */
            --shadow-sm: 0 2px 8px rgba(26, 47, 90, 0.08);
            --shadow-md: 0 8px 24px rgba(26, 47, 90, 0.12);
            --shadow-lg: 0 16px 48px rgba(26, 47, 90, 0.16);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
            }
        }

        /* ============================================
           RESET & BASE
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: var(--bg-primary-light);
            color: var(--text-primary-light);
            line-height: 1.6;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, var(--bg-primary-dark) 0%, var(--bg-secondary-dark) 100%);
            color: var(--text-primary-dark);
        }

        body.light-mode {
            background: linear-gradient(135deg, var(--bg-primary-light) 0%, var(--bg-secondary-light) 100%);
            color: var(--text-primary-light);
        }

        /* ============================================
           HEADER
           ============================================ */

        header {
            background: var(--bg-primary-light);
            border-bottom: 2px solid var(--border-light-mode);
            padding: 2rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        body.dark-mode header {
            background: var(--bg-secondary-dark);
            border-bottom-color: var(--border-dark-mode-strong);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-icon {
            font-size: 2.5rem;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header-title h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--primary-navy);
        }

        body.dark-mode .header-title h1 {
            color: var(--primary-gold);
        }

        .header-subtitle {
            font-size: 0.875rem;
            color: var(--text-tertiary-light);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.25rem;
        }

        body.dark-mode .header-subtitle {
            color: var(--text-tertiary-dark);
        }

        /* ============================================
           SNK BADGE - GOLD ENTERPRISE ANIMATION
           ============================================ */

        .snk-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding: 0.375rem 0.875rem;
            background: linear-gradient(135deg, 
                rgba(212, 165, 116, 0.15) 0%, 
                rgba(232, 201, 179, 0.25) 50%, 
                rgba(212, 165, 116, 0.15) 100%);
            background-size: 200% 100%;
            border: 1px solid var(--primary-gold);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--primary-gold-dark);
            position: relative;
            overflow: hidden;
            animation: shimmer 3s ease-in-out infinite;
            box-shadow: 0 2px 8px rgba(212, 165, 116, 0.2);
        }

        body.dark-mode .snk-badge {
            color: var(--primary-gold);
            background: linear-gradient(135deg, 
                rgba(212, 165, 116, 0.1) 0%, 
                rgba(232, 201, 179, 0.2) 50%, 
                rgba(212, 165, 116, 0.1) 100%);
            background-size: 200% 100%;
            box-shadow: 0 2px 12px rgba(212, 165, 116, 0.3);
        }

        @keyframes shimmer {
            0%, 100% {
                background-position: 0% 50%;
                box-shadow: 0 2px 8px rgba(212, 165, 116, 0.2);
            }
            50% {
                background-position: 100% 50%;
                box-shadow: 0 4px 16px rgba(212, 165, 116, 0.4);
            }
        }

        body.dark-mode .snk-badge {
            animation: shimmerDark 3s ease-in-out infinite;
        }

        @keyframes shimmerDark {
            0%, 100% {
                background-position: 0% 50%;
                box-shadow: 0 2px 12px rgba(212, 165, 116, 0.3);
            }
            50% {
                background-position: 100% 50%;
                box-shadow: 0 4px 20px rgba(212, 165, 116, 0.6);
            }
        }

        .snk-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(232, 201, 179, 0.4), 
                transparent);
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        .snk-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary-gold);
            box-shadow: 0 0 8px var(--primary-gold);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 8px var(--primary-gold);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.3);
                box-shadow: 0 0 16px var(--primary-gold), 0 0 24px var(--primary-gold-light);
            }
        }

        /* ============================================
           THEME TOGGLE
           ============================================ */

        .theme-toggle {
            display: flex;
            gap: 0.5rem;
            background: var(--bg-secondary-light);
            border: 2px solid var(--border-light-mode);
            border-radius: 12px;
            padding: 0.5rem;
            transition: all 0.4s ease;
        }

        body.dark-mode .theme-toggle {
            background: var(--bg-tertiary-dark);
            border-color: var(--border-dark-mode-strong);
        }

        .theme-btn {
            background: none;
            border: none;
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-size: 1.25rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            color: var(--text-tertiary-light);
            font-weight: 600;
        }

        body.dark-mode .theme-btn {
            color: var(--text-tertiary-dark);
        }

        .theme-btn.active {
            background: var(--bg-primary-light);
            color: var(--primary-navy);
            box-shadow: var(--shadow-sm);
        }

        body.dark-mode .theme-btn.active {
            background: var(--bg-secondary-dark);
            color: var(--primary-gold);
        }

        /* ============================================
           MAIN CONTAINER
           ============================================ */

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        .container-header {
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .stats-bar {
            display: flex;
            gap: 3rem;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-tertiary-light);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        body.dark-mode .stat-label {
            color: var(--text-tertiary-dark);
        }

        .stat-value {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--primary-navy);
        }

        body.dark-mode .stat-value {
            color: var(--primary-gold);
        }

        /* ============================================
           TIMER GRID
           ============================================ */

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        @media (max-width: 640px) {
            .timer-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        /* ============================================
           TIMER CARD
           ============================================ */

        .timer-card {
            background: var(--bg-primary-light);
            border: 2px solid var(--border-light-mode);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        body.dark-mode .timer-card {
            background: var(--bg-secondary-dark);
            border-color: var(--border-dark-mode);
        }

        .timer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-navy), var(--primary-gold));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.6s ease;
        }

        .timer-card:hover {
            border-color: var(--primary-gold);
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }

        body.dark-mode .timer-card:hover {
            border-color: var(--primary-gold);
        }

        .timer-card:hover::before {
            transform: scaleX(1);
        }

        .timer-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .timer-icon {
            font-size: 2.5rem;
            flex-shrink: 0;
        }

        .timer-meta {
            flex: 1;
        }

        .timer-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-navy);
            margin-bottom: 0.25rem;
        }

        body.dark-mode .timer-name {
            color: var(--primary-gold);
        }

        .timer-description {
            font-size: 0.875rem;
            color: var(--text-secondary-light);
            line-height: 1.4;
        }

        body.dark-mode .timer-description {
            color: var(--text-secondary-dark);
        }

        .timer-divider {
            height: 1px;
            background: var(--border-light-mode);
            margin: 1.5rem 0;
        }

        body.dark-mode .timer-divider {
            background: var(--border-dark-mode);
        }

        .timer-status {
            font-size: 0.75rem;
            color: var(--text-tertiary-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        body.dark-mode .timer-status {
            color: var(--text-tertiary-dark);
        }

        .timer-value {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-navy);
            margin-bottom: 1.5rem;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        body.dark-mode .timer-value {
            color: var(--primary-gold);
        }

        .timer-end {
            font-size: 0.875rem;
            color: var(--text-secondary-light);
            font-family: 'Courier New', monospace;
        }

        body.dark-mode .timer-end {
            color: var(--text-secondary-dark);
        }

        .timer-progress {
            margin-top: 1.5rem;
            height: 6px;
            background: var(--border-light-mode);
            border-radius: 3px;
            overflow: hidden;
        }

        body.dark-mode .timer-progress {
            background: var(--border-dark-mode);
        }

        .timer-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-navy), var(--primary-gold));
            border-radius: 3px;
            transition: width 1s linear;
        }

        /* ============================================
           TIMER BADGES
           ============================================ */

        .timer-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-light-mode);
        }

        body.dark-mode .timer-badges {
            border-top-color: var(--border-dark-mode);
        }

        .badge {
            display: inline-block;
            padding: 0.375rem 0.875rem;
            background: var(--bg-secondary-light);
            color: var(--text-secondary-light);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid var(--border-light-mode);
        }

        body.dark-mode .badge {
            background: var(--bg-tertiary-dark);
            color: var(--text-secondary-dark);
            border-color: var(--border-dark-mode);
        }

        .badge.active {
            background: rgba(46, 204, 113, 0.1);
            color: var(--success);
            border-color: var(--success);
        }

        .badge.upcoming {
            background: rgba(212, 165, 116, 0.1);
            color: var(--primary-gold-dark);
            border-color: var(--primary-gold-dark);
        }

        .badge.limited {
            background: rgba(243, 156, 18, 0.1);
            color: var(--warning);
            border-color: var(--warning);
        }

        /* ============================================
           EMPTY STATE
           ============================================ */

        .empty-state {
            text-align: center;
            padding: 4rem 1.5rem;
            color: var(--text-tertiary-light);
            font-size: 1.125rem;
        }

        body.dark-mode .empty-state {
            color: var(--text-tertiary-dark);
        }

        /* ============================================
           FOOTER
           ============================================ */

        footer {
            background: var(--bg-secondary-light);
            border-top: 2px solid var(--border-light-mode);
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-tertiary-light);
            font-size: 0.875rem;
            margin-top: 4rem;
            transition: all 0.4s ease;
        }

        body.dark-mode footer {
            background: var(--bg-secondary-dark);
            border-top-color: var(--border-dark-mode-strong);
            color: var(--text-tertiary-dark);
        }

        .footer-divider {
            height: 1px;
            background: var(--border-light-mode);
            margin: 1rem 0;
        }

        body.dark-mode .footer-divider {
            background: var(--border-dark-mode);
        }

        /* ============================================
           ANIMATIONS
           ============================================ */

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timer-card {
            animation: slideIn 0.5s ease-out;
        }

        .timer-card:nth-child(1) { animation-delay: 0.05s; }
        .timer-card:nth-child(2) { animation-delay: 0.1s; }
        .timer-card:nth-child(3) { animation-delay: 0.15s; }
        .timer-card:nth-child(4) { animation-delay: 0.2s; }
        .timer-card:nth-child(5) { animation-delay: 0.25s; }
        .timer-card:nth-child(6) { animation-delay: 0.3s; }
        .timer-card:nth-child(7) { animation-delay: 0.35s; }
        .timer-card:nth-child(8) { animation-delay: 0.4s; }

        /* ============================================
           SCROLLBAR STYLING
           ============================================ */

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary-light);
        }

        body.dark-mode ::-webkit-scrollbar-track {
            background: var(--bg-secondary-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-light-mode);
            border-radius: 5px;
        }

        body.dark-mode ::-webkit-scrollbar-thumb {
            background: var(--border-dark-mode-strong);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-gold-dark);
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */

        @media (max-width: 768px) {
            header {
                padding: 1.5rem;
            }

            .header-content {
                gap: 1rem;
            }

            .header-title h1 {
                font-size: 1.5rem;
            }

            main {
                padding: 2rem 1.5rem;
            }

            .container-header {
                margin-bottom: 2rem;
                gap: 1rem;
            }

            .stats-bar {
                gap: 1.5rem;
            }

            .timer-card {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 1rem;
            }

            .header-title h1 {
                font-size: 1.25rem;
            }

            .header-icon {
                font-size: 2rem;
            }

            main {
                padding: 1.5rem;
            }

            .timer-name {
                font-size: 1.125rem;
            }

            .timer-value {
                font-size: 1.25rem;
            }

            .stat-value {
                font-size: 1.5rem;
            }

            .theme-toggle {
                width: 100%;
                justify-content: space-around;
            }
        }
    </style>
</head>
<body class="light-mode">
    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="header-title">
                <span class="header-icon">⏱️</span>
                <div>
                    <h1>Event Timers</h1>
                    <p class="header-subtitle">Real-Time Countdown System</p>
                    <span class="snk-badge">
                        <span class="snk-dot"></span>
                        SNK #4263
                    </span>
                </div>
            </div>
            <div class="theme-toggle">
                <button class="theme-btn" id="lightBtn" title="Light Mode">☀️</button>
                <button class="theme-btn active" id="darkBtn" title="Dark Mode">🌙</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>

            <div class="stats-bar">

                <div class="stat-item">

        <!-- Timer Grid -->

        <!-- Empty State -->
        <p id="empty-state" class="empty-state" hidden="">No upcoming events.</p>
    </main>

    <!-- Footer -->
    <footer>
        <p>Enterprise Event Countdown System</p>
        <div class="footer-divider"></div>
        <p style="font-size: 0.75rem; opacity: 0.8;">Last updated: <span id="lastUpdate">—</span></p>
    </footer>

    <script>
        /* ============================================

        const timers = [

            },
            {

                startDate: new Date("2026-05-22T00:00Z"),

                icon: "⚡",
                badges: ["Boost", "Day 5"]
            },
            {
                id: 7,
                name: "Chief Gear",
                description: "Chief Gear, Construction, Research, Troops",

        /* ============================================
           TIME FORMATTING
           ============================================ */

        function formatTime(milliseconds) {
            if (milliseconds <= 0) return "Event Started";
            
            const seconds = Math.floor(milliseconds / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) {
                return `${days}d ${hours % 24}h ${minutes % 60}m ${seconds % 60}s`;
            } else if (hours > 0) {
                return `${hours}h ${minutes % 60}m ${seconds % 60}s`;
            } else if (minutes > 0) {
                return `${minutes}m ${seconds % 60}s`;
            } else {
                return `${seconds}s`;
            }
        }

        /* ============================================
           RENDER TIMERS
           ============================================ */

        function renderTimers() {
            const timerList = document.getElementById('timer-list');
            const now = new Date();
            let activeCount = 0;

            timerList.innerHTML = timers.map(timer => {
                const timeUntilStart = timer.startDate - now;
                const timeUntilEnd = timer.endDate - now;
                const isActive = timeUntilStart <= 0 && timeUntilEnd > 0;

                if (isActive) activeCount++;

                const displayTime = timeUntilStart > 0 ? timeUntilStart : timeUntilEnd;
                const totalDuration = timer.endDate - timer.startDate;
                const progress = Math.max(0, (totalDuration - Math.max(0, timeUntilEnd)) / totalDuration * 100);

                return `
                    <article class="timer-card">
                        <div class="timer-header">
                            <div class="timer-icon">${timer.icon}</div>
                            <div class="timer-meta">
                                <h3 class="timer-name">${timer.name}</h3>
                                <p class="timer-description">${timer.description}</p>
                            </div>
                        </div>
                        
                        <p class="timer-status">${timeUntilStart > 0 ? '⏳ Starts in' : '⏰ Ends in'}</p>
                        <p class="timer-value">${formatTime(displayTime)}</p>
                        
                        <div class="timer-divider"></div>
                        
                        <div class="timer-progress">
                            <div class="timer-progress-bar" style="width: ${progress}%"></div>
                        </div>
                        
                        <div class="timer-badges">
                            ${timer.badges.map(badge => {
                                let badgeClass = 'upcoming';
                                if (badge === 'Active' || badge === 'PvP') badgeClass = 'active';
                                if (badge === 'Limited' || badge === 'Premium') badgeClass = 'limited';
                                return `<span class="badge ${badgeClass}">${badge}</span>`;
                            }).join('')}
                        </div>
                    </article>
                `;
            }).join('');

            document.getElementById('activeCount').textContent = activeCount;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

            const emptyState = document.getElementById('empty-state');
            emptyState.hidden = timers.length > 0;
        }

        /* ============================================
           THEME MANAGEMENT
           ============================================ */

        const lightBtn = document.getElementById('lightBtn');
        const darkBtn = document.getElementById('darkBtn');

        function setTheme(theme) {
            document.body.className = theme + '-mode';
            localStorage.setItem('theme', theme);
            
            if (theme === 'dark') {
                darkBtn.classList.add('active');
                lightBtn.classList.remove('active');
            } else {
                lightBtn.classList.add('active');
                darkBtn.classList.remove('active');
            }
        }

        lightBtn.addEventListener('click', () => setTheme('light'));
        darkBtn.addEventListener('click', () => setTheme('dark'));

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);

        /* ============================================
           TIMER UPDATES
           ============================================ */

        let updateInterval = null;

        function startUpdates() {
            renderTimers();

            updateInterval = setInterval(() => {
                const timerList = document.getElementById('timer-list');
                const cards = timerList.querySelectorAll('.timer-card');
                const now = new Date();
                let activeCount = 0;

                cards.forEach((card, index) => {
                    const timer = timers[index];
                    const timeUntilStart = timer.startDate - now;
                    const timeUntilEnd = timer.endDate - now;
                    const isActive = timeUntilStart <= 0 && timeUntilEnd > 0;
                    const totalDuration = timer.endDate - timer.startDate;
                    const progress = Math.max(0, (totalDuration - Math.max(0, timeUntilEnd)) / totalDuration * 100);

                    if (isActive) activeCount++;

                    const displayTime = timeUntilStart > 0 ? timeUntilStart : timeUntilEnd;
                    
                    card.querySelector('.timer-value').textContent = formatTime(displayTime);
                    card.querySelector('.timer-progress-bar').style.width = progress + '%';
                    card.querySelector('.timer-status').textContent = timeUntilStart > 0 ? '⏳ Starts in' : '⏰ Ends in';
                });

                document.getElementById('activeCount').textContent = activeCount;
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            }, 1000);
        }

        startUpdates();

        window.addEventListener('beforeunload', () => {
            if (updateInterval) clearInterval(updateInterval);
        });
    </script>
</body>
</html>

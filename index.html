<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timers</title>
  <style>
    :root {
      --gold:        #d4a574;
      --gold-light:  #e8c99a;
      --gold-dark:   #a87840;
    }
    [data-theme="dark"] {
      --bg:          #0d1b2e;
      --bg-card:     #132140;
      --border:      #2a4070;
      --text-primary:#e8dcc8;
      --text-muted:  #8fa3c0;
      --text-label:  #b8cce0;
      --accent:      #d4a574;
      --shadow:      0 4px 24px rgba(0,0,0,0.5);
    }
    [data-theme="light"] {
      --bg:          #f0f4fa;
      --bg-card:     #ffffff;
      --border:      #c8d6ea;
      --text-primary:#1a2f5a;
      --text-muted:  #4a6080;
      --text-label:  #2a4878;
      --accent:      #a87840;
      --shadow:      0 4px 24px rgba(26,47,90,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #09111f 0%, #1a2f5a 60%, #243f78 100%);
      border-bottom: 2px solid #a87840;
      padding: 0 1.5rem;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      height: 64px; display: flex;
      align-items: center; justify-content: space-between;
    }
    .header-brand { display: flex; align-items: center; gap: 0.65rem; }
    .header-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #a87840, #e8c99a);
      border-radius: 8px; display: flex;
      align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .header-title {
      font-size: 1.15rem; font-weight: 700;
      color: #e8c99a; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .header-subtitle {
      font-size: 0.7rem; color: rgba(212,165,116,0.65);
      letter-spacing: 0.08em; text-transform: uppercase; margin-top: 1px;
    }

    /* ── Toggle ── */
    .toggle-wrap {
      display: flex; align-items: center; gap: 0.5rem;
      cursor: pointer; user-select: none;
    }
    .toggle-label {
      font-size: 0.75rem; color: rgba(212,165,116,0.7);
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .toggle-track {
      width: 44px; height: 24px;
      background: rgba(255,255,255,0.15);
      border: 1px solid #a87840; border-radius: 12px;
      position: relative; transition: background 0.2s;
    }
    .toggle-track.active { background: rgba(212,165,116,0.3); }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px;
      background: #d4a574; border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-track.active .toggle-thumb { transform: translateX(20px); }

    /* ── Layout ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }
    .section-label {
      display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;
    }
    .section-label::before {
      content: ''; display: block; width: 4px; height: 20px;
      background: linear-gradient(180deg, #d4a574, #a87840); border-radius: 2px;
    }
    .section-label span {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-muted);
    }
    .section-label::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    /* ── Card ── */
    .timer-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 1.35rem 1.4rem;
      box-shadow: var(--shadow);
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      position: relative; overflow: hidden;
    }
    .timer-card::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, #a87840, #e8c99a, #a87840);
    }
    .timer-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow), 0 0 0 1px #a87840;
      border-color: #a87840;
    }
    .card-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.2rem 0.55rem; border-radius: 4px; margin-bottom: 0.75rem;
    }
    .card-badge.upcoming {
      background: rgba(212,165,116,0.12); color: #d4a574;
      border: 1px solid rgba(212,165,116,0.3);
    }
    .card-badge.active {
      background: rgba(72,187,120,0.12); color: #68d391;
      border: 1px solid rgba(72,187,120,0.3);
    }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge-dot.pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.4; transform:scale(.7); }
    }
    .card-description {
      font-size: 0.95rem; font-weight: 700;
      color: var(--text-primary); line-height: 1.3; margin-bottom: 1rem;
    }
    .card-divider {
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
      margin-bottom: 1rem;
    }
    .timer-block { margin-bottom: 0.6rem; }
    .timer-block:last-child { margin-bottom: 0; }
    .timer-block-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.25rem;
    }
    .timer-block-value.ends {
      font-size: 0.78rem; font-weight: 500; color: var(--text-label);
    }

    /* ── Segments ── */
    .segments {
      display: flex; align-items: flex-start;
      gap: 0.3rem; flex-wrap: nowrap;
    }
    .seg { text-align: center; min-width: 34px; }
    .seg-value {
      font-size: 1.4rem; font-weight: 800; color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1; letter-spacing: -0.02em;
    }
    .seg-unit {
      font-size: 0.55rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted); margin-top: 2px;
    }
    .seg-sep {
      font-size: 1.4rem; font-weight: 800; color: var(--border);
      line-height: 1; padding-bottom: 14px; align-self: flex-end;
    }

    /* ── Empty ── */
    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
    .empty-icon  { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }
    .empty-title {
      font-size: 1rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 0.5rem;
    }
    .empty-sub { font-size: 0.8rem; }

    /* ── Footer ── */
    .footer {
      text-align: center; padding: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted); font-size: 0.7rem;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .footer span { color: #a87840; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .header-inner   { height: 56px; }
      .header-title   { font-size: 0.95rem; }
      .header-subtitle{ display: none; }
      .container      { padding: 1.25rem 1rem 2rem; }
      .timer-grid     { grid-template-columns: 1fr; }
      .seg-value      { font-size: 1.15rem; }
      .seg            { min-width: 28px; }
    }
    @media (min-width: 1400px) {
      .timer-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body data-theme="dark">

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-icon">&#9203;</div>
      <div>
        <div class="header-title">Event Timers</div>
        <div class="header-subtitle">Live Countdown Dashboard</div>
      </div>
    </div>
    <div class="toggle-wrap" id="themeToggle"
         role="button" aria-label="Toggle theme" tabindex="0">
      <span class="toggle-label" id="toggleLabel">Dark</span>
      <div class="toggle-track" id="toggleTrack">
        <div class="toggle-thumb"></div>
      </div>
    </div>
  </div>
</header>

<!-- Main -->
<main class="container">
  <div class="section-label">
    <span>Active &amp; Upcoming Events</span>
  </div>
  <div class="timer-grid" id="timerGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">&#128235;</div>
    <div class="empty-title">No Timers Available</div>
    <div class="empty-sub" id="emptyMsg">No upcoming events scheduled.</div>
  </div>
</main>

<!-- Footer -->
<footer class="footer">
  Data source: <span>wos-hoc-4263</span>
  &nbsp;&middot;&nbsp; Updates every second
</footer>

<script>
  /* ── ECHTE ZEITEN aus wos-hoc-4263.support-009.workers.dev/timers.json ── */
  const timersData = [
    {
      "startDate": "2026-05-18T00:00Z",
      "endDate": "2026-05-24T23:59Z",
      "description": "HoC"
    },
    {
      "startDate": "2026-05-18T00:00Z",
      "endDate": "2026-05-18T23:59Z",
      "description": "City Construction (Construction, Research)"
    },
    {
      "startDate": "2026-05-19T00:00Z",
      "endDate": "2026-05-19T23:59Z",
      "description": "Hero Development (Lucky Wheel, Shards, Gathering)"
    },
    {
      "startDate": "2026-05-20T00:00Z",
      "endDate": "2026-05-20T23:59Z",
      "description": "Train Troops"
    },
    {
      "startDate": "2026-05-21T00:00Z",
      "endDate": "2026-05-21T23:59Z",
      "description": "Beast Slay"
    },
    {
      "startDate": "2026-05-22T00:00Z",
      "endDate": "2026-05-22T23:59Z",
      "description": "Power Boost(Essence Stones, Widget, Construction, Research, Troops)"
    },
    {
      "startDate": "2026-05-23T00:00Z",
      "endDate": "2026-05-23T23:59Z",
      "description": "Chief Gear, Construction, Research, Troops"
    },
    {
      "startDate": "2026-05-24T00:00Z",
      "endDate": "2026-05-24T23:59Z",
      "description": "Speedups"
    }
  ];

  /* ── Theme ── */
  const body        = document.body;
  const toggleTrack = document.getElementById('toggleTrack');
  const toggleLabel = document.getElementById('toggleLabel');

  function applyTheme(t) {
    body.setAttribute('data-theme', t);
    const isDark = t === 'dark';
    toggleTrack.classList.toggle('active', !isDark);
    toggleLabel.textContent = isDark ? 'Dark' : 'Light';
    try { localStorage.setItem('cd-theme', t); } catch(e) {}
  }

  (function () {
    let saved = 'dark';
    try { saved = localStorage.getItem('cd-theme') || 'dark'; } catch(e) {}
    applyTheme(saved);
  })();

  document.getElementById('themeToggle').addEventListener('click', () => {
    applyTheme(body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  document.getElementById('themeToggle').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      applyTheme(body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
  });

  /* ── Helpers ── */
  function pad(n) { return String(n).padStart(2, '0'); }

  function timeParts(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    return {
      d: Math.floor(t / 86400),
      h: Math.floor((t % 86400) / 3600),
      m: Math.floor((t % 3600) / 60),
      s: t % 60
    };
  }

  function segsHTML(ms) {
    const { d, h, m, s } = timeParts(ms);
    const seg = (v, u) =>
      '<div class="seg">' +
        '<div class="seg-value">' + pad(v) + '</div>' +
        '<div class="seg-unit">'  + u      + '</div>' +
      '</div>';
    const sep = '<div class="seg-sep">:</div>';
    return '<div class="segments">' +
      seg(d,'Days') + sep + seg(h,'Hrs') + sep + seg(m,'Min') + sep + seg(s,'Sec') +
    '</div>';
  }

  function endsText(ms) {
    const { d, h, m, s } = timeParts(ms);
    const p = [];
    if (d) p.push(d + ' day'  + (d !== 1 ? 's' : ''));
    if (h) p.push(h + ' hr'   + (h !== 1 ? 's' : ''));
    if (m) p.push(m + ' min');
    p.push(s + ' sec');
    return p.join(' ');
  }

  function esc(str) {
    return str
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ── Timer Setup ── */
  const timers = timersData.map(t => ({
    description: t.description,
    start: Date.parse(t.startDate),
    end: Date.parse(t.endDate)
  })).filter(t => !isNaN(t.start) && !isNaN(t.end) && t.end > t.start);

  const grid       = document.getElementById('timerGrid');
  const emptyState = document.getElementById('emptyState');

  /* ── Build card ── */
  function buildCard(timer) {
    const card   = document.createElement('div');
    card.className = 'timer-card';
    const now    = Date.now();
    const active = now >= timer.start && now <= timer.end;
    const cd     = active ? timer.end - now : timer.start - now;
    const ei     = timer.end - now;

    card.innerHTML =
      '<div class="card-badge ' + (active ? 'active' : 'upcoming') + '">' +
        '<div class="badge-dot' + (active ? ' pulse' : '') + '"></div>' +
        (active ? 'Active' : 'Upcoming') +
      '</div>' +
      '<div class="card-description">' + esc(timer.description) + '</div>' +
      '<div class="card-divider"></div>' +
      '<div class="timer-block">' +
        '<div class="timer-block-label">' + (active ? 'Ends in' : 'Starts in') + '</div>' +
        '<div class="timer-block-value" id="main-' + timer.start + '">' + segsHTML(cd) + '</div>' +
      '</div>' +
      (active ? '' :
        '<div class="timer-block">' +
          '<div class="timer-block-label">Ends in</div>' +
          '<div class="timer-block-value ends" id="end-' + timer.start + '">' +
            endsText(ei) +
          '</div>' +
        '</div>'
      );
    return card;
  }

  /* ── Render ── */
  function renderAll() {
    const now     = Date.now();
    const visible = timers.filter(t => now <= t.end);

    if (visible.length === 0) {
      grid.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    // Full rebuild if card count changed
    if (grid.querySelectorAll('.timer-card').length !== visible.length) {
      grid.innerHTML = '';
      visible.forEach(t => grid.appendChild(buildCard(t)));
      return;
    }

    // In-place update
    visible.forEach(timer => {
      const active = now >= timer.start && now <= timer.end;
      const cd     = active ? timer.end - now : timer.start - now;
      const ei     = timer.end - now;
      const me     = document.getElementById('main-' + timer.start);
      const ee     = document.getElementById('end-'  + timer.start);
      if (me) me.innerHTML    = segsHTML(cd);
      if (ee) ee.textContent  = endsText(ei);
    });
  }

  renderAll();
  setInterval(renderAll, 1000);
</script>
</body>
</html>
